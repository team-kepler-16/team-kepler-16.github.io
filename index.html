<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Abandoned but Not Forgotten: Mars</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous" defer></script>
    <script src="js/script.js" defer></script>
    <script type="module" src="js/mars.js"></script>
  </head>
  <body>
    <header class="site-header home-header">
      <div class="title-lockup">
        <span class="planet-mark" aria-hidden="true"></span>
        <div class="title-copy">
          <p class="eyebrow" data-i18n="archiveLabel">Mars Exploration / Archive</p>
          <h1 id="mars-title" data-i18n="mainTitle">NASA: 50 Years of Landings on Mars</h1>
        </div>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <button id="sound-toggle" type="button" aria-pressed="false">Mute</button>
        <button id="locale-toggle" type="button" aria-label="Language: English. Switch to Spanish">EN</button>
        <a href="about.html" data-i18n="about">About</a>
      </nav>
    </header>
    <main id="mars-stage">
      <canvas id="mars-canvas" role="img" aria-label="Mars globe with interactive points. Hover over a point to pause rotation and show its red outline. Click a point to open its window. Click and drag horizontally, or drag with one finger, to rotate it around its axis. Use the mouse wheel or a two-finger pinch to zoom. Select a point from the list to open its window and center it horizontally while keeping its latitude.">
        A slowly rotating 3D view of Mars with interactive points.
      </canvas>
      <aside class="points-panel" aria-labelledby="points-title">
        <div class="points-panel-heading">
          <h2 id="points-title" data-i18n="pointsTitle">Points</h2>
          <span class="points-count" aria-hidden="true">18</span>
        </div>
        <ol class="points-list">
          <li><button class="point-button" type="button" data-marker-index="0" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 1</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="1" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 2</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="2" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 3</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="3" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 4</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="4" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 5</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="5" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 6</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="6" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 7</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="7" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 8</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="8" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 9</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="9" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 10</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="10" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 11</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="11" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 12</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="12" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 13</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="13" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 14</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="14" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 15</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="15" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 16</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="16" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 17</span></button></li>
          <li><button class="point-button" type="button" data-marker-index="17" aria-pressed="false"><span class="point-name"><span data-i18n="pointPrefix">Point</span> 18</span></button></li>
        </ol>
      </aside>
      <section id="point-window" class="point-window" role="dialog" aria-labelledby="point-window-title" aria-hidden="true" hidden>
        <div class="point-window-card">
          <div class="point-window-heading">
            <h2 id="point-window-title"><span data-i18n="pointPrefix">Point</span> <span id="point-window-number">1</span></h2>
            <button id="point-window-close" class="point-window-close" type="button" data-i18n-aria-label="closeWindow" aria-label="Close window">×</button>
          </div>
          <div class="point-window-content">
            <p class="point-window-caption" data-i18n="selectedPoint">Selected surface point</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
